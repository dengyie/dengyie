name: CI

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # grs shim: route governance, error-card normalization, rate limiting
      - name: node tests (server.mjs)
        # explicit file: node 22 --test does not glob directories
        run: node --test infrastructure/grs/server/server.test.mjs

      # generate-stats.py: fallback chain, error-card rejection, retry backoff
      - name: python tests (generate-stats.py)
        run: python -m unittest discover -s scripts -v
