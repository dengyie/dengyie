name: Update GitHub Stats SVG

on:
  schedule:
    - cron: '23 1 * * *' # 每天刷新;00:00 UTC 是调度高峰,实测被 GitHub 延迟 3-5h,错峰到 01:23 UTC(≈北京 09:23 + 延迟)
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Combined Stats SVG
        run: python3 scripts/generate-stats.py

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg
          if git diff --staged --quiet; then
            echo "No changes in stats SVG"
          else
            git commit -m "chore: auto update github-stats.svg"
            git push
          fi
